# One command for the whole stack:   docker compose up --build
# API docs:  http://localhost:8000/docs        Qdrant UI: http://localhost:6333/dashboard
name: case-ai

x-app: &app
  build: .
  env_file: .env
  environment:
    REDIS_URL: redis://redis:6379/0
    QDRANT_URL: http://qdrant:6333
    LOCAL_STORAGE_DIR: /app/data/uploads
    DEV_WEBHOOK_ECHO_URL: http://api:8000/api/v1/dev/webhook-echo
  volumes:
    - ./data:/app/data
  depends_on:
    redis:
      condition: service_healthy
    qdrant:
      condition: service_started
  restart: unless-stopped

services:
  api:
    <<: *app
    command: ["sh", "-c", "exec gunicorn app.main:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 -w $${WEB_CONCURRENCY:-2} --timeout 120 --graceful-timeout 30"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    # scale horizontally with:  docker compose up --scale worker=3
    command: ["sh", "-c", "exec celery -A app.workers.celery_app:celery_app worker -Q case_ai -l INFO --concurrency=$${CELERY_CONCURRENCY:-2} --max-tasks-per-child=100 -Ofair"]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 45s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:${QDRANT_IMAGE_TAG:-latest}   # pin a version in production
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  flower:                      # optional Celery monitor: docker compose --profile monitoring up
    profiles: ["monitoring"]
    image: mher/flower:2.0
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  redis_data:
  qdrant_data:
